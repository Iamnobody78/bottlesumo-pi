site_name: BottleSumo 旗舰版
site_description: 140GB 物理仿真 + AI 治理旗舰仓库 — Governance Center Dashboard
repo_url: https://github.com/Iamnobody78/bottlesumo-pi
site_url: https://iamnobody78.github.io/bottlesumo-pi/

theme:
  name: material
  language: zh
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.sections
    - navigation.top
    - toc.integrate

nav:
  - 首页: index.md
  - 架构: architecture.md
  - 架构文档:
    - 生产化路线图: architecture/ROADMAP_PRODUCTION.md
    - 架构演进路线: architecture/ROADMAP_v2.md
    - 数据库设计: architecture/database.md
    - 可观测性: architecture/observability.md
    - 部署指南: architecture/deployment.md
    - 认证与授权: architecture/authz.md
  - 治理: governance.md
  - 开发: contributing.md
  - 变更: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

extra:
  generator: false
