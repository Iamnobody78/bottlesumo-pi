name: Docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "ARCHITECTURE.md", "CONTRIBUTING.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs (mkdocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install mkdocs
        run: pip install mkdocs-material
      - name: Check ARCHITECTURE.md sync (C5 gate)
        run: |
          python - <<'EOF'
          import re, pathlib
          arch = pathlib.Path("ARCHITECTURE.md").read_text(encoding="utf-8")
          for doc, name in [("docs/architecture.md", "docs/architecture.md"),
                            ("docs/architecture_overview.md", "docs/architecture_overview.md")]:
              if not pathlib.Path(doc).exists():
                  raise SystemExit(f"C5 FAIL: {doc} missing")
              d = pathlib.Path(doc).read_text(encoding="utf-8")
              s_arch = set(re.findall(r"S\d{2}", arch))
              s_doc = set(re.findall(r"S\d{2}", d))
              missing = s_doc - s_arch
              if missing:
                  raise SystemExit(f"C5 FAIL: {name} 引用 {sorted(missing)} 不在 ARCHITECTURE.md")
              print(f"C5 OK: {name} 阶段一致 ({len(s_doc)} 个 S-tag)")
          EOF
      - name: Build docs
        # --strict 保留真实 warning 敏感性; Material 团队公告(2.0迁移提示) 为已知非致命警告,
        # 通过 grep 白名单过滤其退出码 (不用 `|| true` 以免吞掉真实构建失败)
        run: |
          set -o pipefail
          mkdocs build --strict 2>&1 | tee /tmp/mkdocs.log
          if grep -q "Warning from the Material for MkDocs team" /tmp/mkdocs.log; then
            # 仅当除 Material 公告外无其他 WARNING/ERROR 时视为通过
            if ! grep -E "^(WARNING|ERROR)" /tmp/mkdocs.log | grep -v "Warning from the Material for MkDocs team" | grep -q .; then
              echo "✅ docs built (only Material team announcement warning)"
              exit 0
            fi
          fi
          exit ${PIPESTATUS[0]}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
